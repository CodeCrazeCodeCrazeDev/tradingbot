version: '3.8'

services:
  # Main trading bot service with strategy
  trading-bot:
    # Build context must be the repo root (this file lives in config/).
    build:
      context: ..
    container_name: elite-trading-bot
    restart: unless-stopped
    environment:
      - PAPER_TRADING=true
      - MAX_DAILY_LOSS=100
      - MAX_POSITION_SIZE=0.01
      - MAX_POSITIONS=3
    volumes:
      - ../logs:/app/logs
      # EURUSD replay source for main.py (untracked file; provision locally)
      - ../market_data.db:/app/market_data.db:ro
    healthcheck:
      # Worker liveness: no HTTP listener exists; check the python process.
      test: ["CMD", "python", "-c", "import psutil,sys; sys.exit(0 if any('main.py' in ' '.join(p.cmdline() or []) for p in psutil.process_iter()) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Test service: short end-to-end smoke of the canonical entry point on
  # synthetic data (the image does not ship the test suite).
  test:
    build:
      context: ..
    container_name: elite-trading-bot-test
    environment:
      - PAPER_TRADING=true
    volumes:
      - ../logs:/app/logs
    command: python main.py --mode paper --synthetic --cycles 3 --interval 0.1
