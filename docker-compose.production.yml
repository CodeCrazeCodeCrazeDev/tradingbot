version: '3.8'

# ===========================================
# AlphaAlgo Trading Bot - Production Stack
# ===========================================
# Includes: Trading Bot, PostgreSQL, Redis, 
# Prometheus, Grafana, and supporting services

networks:
  alphaalgo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  timescaledb-data:

services:
  # =========================================
  # Core Trading Bot
  # =========================================
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: alphaalgo-bot
    restart: unless-stopped
    # NOTE: env_file removed — a broad .env injection could leak arbitrary
    # secrets into the paper worker (MP-040). Declare only needed vars.
    environment:
      - DATABASE_URL=postgresql://alphaalgo:${DB_PASSWORD:-alphaalgo123}@postgres:5432/alphaalgo
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PAPER_TRADING=${PAPER_TRADING:-true}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backups:/app/backups
      - ./state:/app/state
      # EURUSD replay source for main.py (untracked; provision before up)
      - ./market_data.db:/app/market_data.db:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Worker liveness: no HTTP listener exists yet, so check the process.
      test: ["CMD", "python", "-c", "import psutil,sys; sys.exit(0 if any('main.py' in ' '.join(p.cmdline() or []) for p in psutil.process_iter()) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - alphaalgo-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # =========================================
  # PostgreSQL Database
  # =========================================
  postgres:
    image: postgres:15-alpine
    container_name: alphaalgo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=alphaalgo
      - POSTGRES_PASSWORD=${DB_PASSWORD:-alphaalgo123}
      - POSTGRES_DB=alphaalgo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaalgo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaalgo-network

  # =========================================
  # TimescaleDB for Time-Series Data
  # =========================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: alphaalgo-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_USER=alphaalgo
      - POSTGRES_PASSWORD=${DB_PASSWORD:-alphaalgo123}
      - POSTGRES_DB=alphaalgo_timeseries
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphaalgo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaalgo-network

  # =========================================
  # Redis Cache
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: alphaalgo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alphaalgo-network

  # =========================================
  # Prometheus Monitoring
  # =========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: alphaalgo-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - alphaalgo-network

  # =========================================
  # Grafana Dashboard
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: alphaalgo-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - alphaalgo-network

  # =========================================
