version: '3.8'

services:
  # Main trading bot service with strategy
  trading-bot:
    build: .
    container_name: elite-trading-bot
    restart: unless-stopped
    environment:
      # Broker credentials are intentionally not injected into the paper
      # worker — the canonical path simulates fills locally (MP-040).
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - SMTP_SERVER=smtp-mail.outlook.com
      - SMTP_PORT=587
      - SMTP_USERNAME=peterkiragu68@outlook.com
      - MAX_DAILY_LOSS=100
      - MAX_POSITION_SIZE=0.01
      - MAX_POSITIONS=3
      - PAPER_TRADING=true
    volumes:
      - ./logs:/app/logs
      # EURUSD replay source for main.py (untracked file; provision locally)
      - ./market_data.db:/app/market_data.db:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os; import psutil; exit(0 if 'python' in ' '.join([p.name() for p in psutil.process_iter()]) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Smoke service: short end-to-end run of the canonical entry point on
  # synthetic data (the image does not ship the test suite).
  test:
    build: .
    container_name: elite-trading-bot-test
    environment:
      - PAPER_TRADING=true
    volumes:
      - ./logs:/app/logs
    command: python main.py --mode paper --synthetic --cycles 3 --interval 0.1
